[project]
name = "agentic-graph"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cognee[postgres-binary]>=1.5.4",
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "granian>=2.8.2",
    "httptools>=0.8.0",
    "httpx>=0.28.1",
    "orjson>=3.12.0",
    "python-dotenv>=1.2.3",
    "rich>=14.3.4",
    "typer>=0.27.2",
    "uvicorn>=0.52.4",
    "uvloop>=0.22.1",
    "watchdog>=6.0.0",
]

[project.scripts]
ag-server = "agentic_graph.server:main"
ag-watch = "agentic_graph.daemon:main"
ag-migrate = "agentic_graph.cli.migrate:main"
ag-link = "agentic_graph.cli.link:main"
[tool.setuptools.packages.find]
where = ["."]
include = ["agentic_graph*"]

[tool.uv]
package = true

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0"]
